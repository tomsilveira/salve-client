[package]
name = "salve"
version = "0.1.0"
description = "Salve - Discord-like chat app"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["default", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package.metadata.tauri.build]
dist-dir = "../dist"
dev-path = "http://localhost:5173"
before-build = ["npm run build"]
before-dev = ["npm run dev"]

[[package.metadata.tauri.windows]]
title = "Salve"
width = 1200
height = 700
min_width = 800
min_height = 500
resizable = true
fullscreen = false
decorations = true

[package.metadata.tauri.security]
csp = "default-src 'self'; connect-src 'self' 'unsafe-eval' ws: wss: http: https: turn:; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data: https:; media-src 'self' blob: mediastream:; frame-src 'self'; object-src 'none';"

[workspace]
